<div class="min-h-screen bg-gray-100">
  <div class="p-6">

    <h1 class="text-xl font-semibold text-gray-800 mb-6">Dashboard</h1>

    <div class="grid grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="text-sm text-gray-500 mb-1">Total Employees</p>
        <p class="text-3xl font-semibold text-gray-800">{{ total }}</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="text-sm text-gray-500 mb-1">Active</p>
        <p class="text-3xl font-semibold text-green-600">{{ active }}</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="text-sm text-gray-500 mb-1">On Leave</p>
        <p class="text-3xl font-semibold text-yellow-500">{{ onLeave }}</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="text-sm text-gray-500 mb-1">Inactive</p>
        <p class="text-3xl font-semibold text-gray-400">{{ inactive }}</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="col-span-2 bg-white rounded-lg shadow-sm p-5">
        <h2 class="text-sm font-semibold text-gray-700 mb-4">Headcount by Department</h2>
        <div *ngFor="let dept of departments" class="flex items-center gap-3 mb-3">
          <span class="text-sm text-gray-600 w-24 shrink-0">{{ dept }}</span>
          <div class="flex-1 bg-gray-100 rounded-full h-2">
            <div class="bg-blue-500 h-2 rounded-full transition-all duration-500"
                 [style.width]="getBarWidth(dept)"></div>
          </div>
          <span class="text-sm text-gray-500 w-6 text-right">{{ getCountByDepartment(dept) }}</span>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-sm p-5">
        <h2 class="text-sm font-semibold text-gray-700 mb-4">Recent Employees</h2>
        <div *ngFor="let emp of recentEmployees" class="flex items-center justify-between mb-3">
          <div>
            <p class="text-sm font-medium text-gray-800">{{ emp.firstName }} {{ emp.lastName }}</p>
            <p class="text-xs text-gray-400">{{ emp.department }}</p>
          </div>
          <span class="text-xs px-2 py-1 rounded-full font-medium" [ngClass]="getStatusClass(emp.status)">
            {{ emp.status }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
