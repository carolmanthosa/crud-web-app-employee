<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">
        {{ isEditMode ? 'Edit Employee' : 'Add Employee' }}
      </h1>
      <a routerLink="/employees" class="text-gray-600 hover:text-gray-800">
        ← Back to List
      </a>
    </div>

    @if (isLoading) {
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <p class="text-gray-500">Loading employee details...</p>
      </div>
    } @else {

      @if (errorMessage) {
        <div class="bg-red-100 text-red-700 px-4 py-3 rounded-lg mb-4">
          {{ errorMessage }}
        </div>
      }
      @if (successMessage) {
        <div class="bg-green-100 text-green-700 px-4 py-3 rounded-lg mb-4">
          {{ successMessage }}
        </div>
      }

      <div class="bg-white rounded-lg shadow p-6">
        <form (ngSubmit)="onSubmit()">

          <!-- Employee ID (read-only, shown in edit mode only) -->
          @if (isEditMode) {
            <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg flex items-center gap-3">
              <span class="text-sm font-medium text-blue-700">Employee ID:</span>
              <span class="text-sm font-bold text-blue-900">{{ employee.employeeId }}</span>
            </div>
          }

          <!-- ID Number -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">ID Number (Government ID)</label>
            <input type="text" [(ngModel)]="employee.idNumber" name="idNumber"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="e.g. 9001015800084">
          </div>

          <div class="grid grid-cols-3 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
              <input type="text" [(ngModel)]="employee.firstName" name="firstName"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="John">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
              <input type="text" [(ngModel)]="employee.middleName" name="middleName"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Optional">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
              <input type="text" [(ngModel)]="employee.lastName" name="lastName"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Doe">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
              <input type="email" [(ngModel)]="employee.email" name="email"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="john@company.com">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
              <input type="text" [(ngModel)]="employee.phone" name="phone"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="+27 123 456 789">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Department *</label>
              <select [(ngModel)]="employee.department" name="department"
                      class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Select Department</option>
                @for (dept of departments; track dept) {
                  <option [value]="dept">{{dept}}</option>
                }
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Position *</label>
              <input type="text" [(ngModel)]="employee.position" name="position"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                     placeholder="Developer">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select [(ngModel)]="employee.status" name="status"
                      class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                @for (status of statuses; track status) {
                  <option [value]="status">{{status}}</option>
                }
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Hire Date</label>
              <input type="date" [(ngModel)]="employee.hireDate" name="hireDate"
                     class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div class="flex gap-3 justify-end mt-6">
            <a routerLink="/employees" class="px-6 py-2 border rounded-lg hover:bg-gray-50">
              Cancel
            </a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              {{ isEditMode ? 'Update Employee' : 'Add Employee' }}
            </button>
          </div>
        </form>
      </div>
    }
  </div>
</div>
